<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>skills Repo Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Repo Brief: Obsidian-style note. One 720px reading column, outline pane on the right, callouts, internal links, hover previews. */
:root{
  --bg:#FFFFFF; --bg2:#F6F6F6; --tx:#222222; --tx2:#5C5C5C; --tx3:#ABABAB; --bd:#E3E3E3; --bd2:#CFCFCF;
  --ac:#7C5CEA; --ac-bg:rgba(124,92,234,.09); --c-abs:#0FA3B1; --c-tip:#0FA3B1;
  --bad:#E93147; --warn:#E07A00; --good:#08A94E; --code-bg:#F3F3F3;
  --f:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sh:0 8px 28px rgba(0,0,0,.14); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E1E1E; --bg2:#262626; --tx:#DADADA; --tx2:#A3A3A3; --tx3:#666666; --bd:#333333; --bd2:#454545;
  --ac:#A68AF9; --ac-bg:rgba(166,138,249,.12); --c-abs:#3FC5D0; --c-tip:#3FC5D0;
  --bad:#FB464C; --warn:#E9973F; --good:#44CF6E; --code-bg:#2A2A2A; --sh:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1E1E1E; --bg2:#262626; --tx:#DADADA; --tx2:#A3A3A3; --tx3:#666666; --bd:#333333; --bd2:#454545;
  --ac:#A68AF9; --ac-bg:rgba(166,138,249,.12); --c-abs:#3FC5D0; --c-tip:#3FC5D0;
  --bad:#FB464C; --warn:#E9973F; --good:#44CF6E; --code-bg:#2A2A2A; --sh:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 80px}
h1,h2,h3{margin:0;line-height:1.25;font-weight:700;text-wrap:balance}
p{margin:0}
a{color:var(--ac);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--m);font-size:.86em;background:var(--code-bg);border-radius:4px;padding:.1em .35em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.t-bad{color:var(--bad)} .t-warn{color:var(--warn)} .t-good{color:var(--good)}

.layout{max-width:980px;margin:0 auto;display:grid;grid-template-columns:minmax(0,720px) 200px;gap:60px;justify-content:center}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,720px)}.outline{display:none}}
.note{display:flex;flex-direction:column;gap:14px;min-width:0}
.note h1{font-size:34px;letter-spacing:-.01em}
.note h2{font-size:22px;margin-top:30px;padding-top:4px;scroll-margin-top:20px}
.note ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.note li::marker{color:var(--tx3)}
.small{font-size:13.5px}

.props{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;font-size:14px;padding:8px 0 14px;border-bottom:1px solid var(--bd);margin:0}
.props dt{color:var(--tx2)}
.props dd{margin:0;min-width:0}
.tagp{display:inline-block;background:var(--ac-bg);color:var(--ac);border-radius:10px;padding:0 8px;font-size:13px}

.wl{appearance:none;border:none;background:none;padding:0;margin:0;color:var(--ac);cursor:pointer;font:inherit}
.wl:hover{text-decoration:underline}

.callout{border-radius:6px;padding:12px 16px;background:color-mix(in srgb,var(--cc) 9%,transparent);display:flex;flex-direction:column;gap:8px}
.callout .ct{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--cc);font-size:15px}
.callout .ct svg{width:16px;height:16px;flex:none}
.callout.abs{--cc:var(--c-abs)} .callout.tip{--cc:var(--c-tip)}
.callout p{font-size:15.5px}

.outline{position:sticky;top:40px;align-self:start;font-size:13.5px}
.outline p{color:var(--tx3);font-size:12px;font-weight:600;margin-bottom:6px}
.outline a{display:block;color:var(--tx2);padding:3px 0 3px 10px;border-left:1px solid var(--bd)}
.outline a.on{color:var(--tx);border-left-color:var(--ac)}
.outline a:hover{text-decoration:none;color:var(--tx)}

.btn{appearance:none;border:1px solid var(--bd2);background:var(--bg);color:var(--tx);border-radius:6px;padding:5px 12px;font-size:14px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--bg2)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{appearance:none;border:1px solid var(--bd);background:none;border-radius:10px;padding:1px 9px;font-size:12px;color:var(--tx2);cursor:pointer}
.seg button.on{border-color:var(--ac);color:var(--ac)}

/* swimlane: lanes are rows, phases are columns */
.slw{position:relative}
.slx{overflow-x:auto;padding-bottom:6px}
.slx::-webkit-scrollbar{height:8px}
.slx::-webkit-scrollbar-track{background:var(--bg2);border-radius:4px}
.slx::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}
.slx::-webkit-scrollbar-thumb:hover{background:var(--tx3)}
@supports not selector(::-webkit-scrollbar){.slx{scrollbar-width:thin;scrollbar-color:var(--bd2) var(--bg2)}}
.slw.more::after{content:"";position:absolute;top:0;right:0;bottom:14px;width:48px;background:linear-gradient(to right,transparent,var(--bg));pointer-events:none}
.sl{display:grid;border-top:1px solid var(--bd)}
.sl>div:first-child,.sl .ln{position:sticky;left:0;z-index:1;background:var(--bg)}
.sl>div{padding:8px;border-bottom:1px solid var(--bd);min-width:0}
.sl .ph{border-bottom:1px solid var(--bd2);display:flex;flex-direction:column;gap:2px}
.sl .ph b{font-size:13.5px}
.sl .ph span{font-size:12.5px;color:var(--tx2);line-height:1.4}
.sl .ph+.ph,.sl .cell+.cell{border-left:1px dashed var(--bd)}
.sl .ln{font-size:12.5px;color:var(--tx2);font-weight:600;padding-top:11px}
.sl .cell{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.st{overflow-wrap:anywhere;min-width:0;appearance:none;cursor:pointer;text-align:left;background:var(--bg);border:1px solid var(--bd2);border-radius:5px;padding:3px 7px;font-size:12.5px;line-height:1.3;display:flex;gap:5px;align-items:baseline;max-width:100%}
.st i{font-style:normal;color:var(--tx3);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.st.script{font-family:var(--m);font-size:11.5px}
.st .lp{color:var(--warn);font-family:var(--f)}
.st:hover{border-color:var(--tx2)}
.st.on{border-color:var(--ac);background:var(--ac-bg)}
.slm{display:none}
@media (max-width:640px){
  .slw{display:none}
  .slm{display:flex;flex-direction:column;gap:14px}
  .slm .ph b{font-size:14px} .slm .ph span{display:block;font-size:13px;color:var(--tx2)}
  .slm .steps{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .slm .st{width:100%}
  .slm .st em{font-style:normal;margin-left:auto;color:var(--tx3);font-family:var(--f);font-size:11px}
}

/* demo */
.frame{height:520px;overflow-y:auto;position:relative;border:1px solid var(--bd);border-radius:6px;background:var(--bg2)}
.layer{position:sticky;top:0;height:520px;overflow:hidden}
.layer img{position:absolute;left:0;top:0;width:100%;max-width:100%;display:block;will-change:transform}
.layer img.b{clip-path:inset(0 0 0 50%)}
.dtag{position:absolute;top:12px;z-index:3;font-size:12px;font-weight:600;background:var(--bg);color:var(--tx);border:1px solid var(--bd2);border-radius:10px;padding:2px 9px;white-space:nowrap}
.dtag.l{right:calc(50% + 8px)} .dtag.r{left:calc(50% + 8px)}
.hd{position:absolute;top:0;bottom:0;left:50%;width:28px;margin-left:-14px;z-index:4;cursor:ew-resize;touch-action:none;display:flex;justify-content:center}
.hd::before{content:"";width:2px;height:100%;background:var(--ac)}
.hd .knob{position:absolute;top:50%;width:30px;height:24px;margin-top:-12px;border-radius:12px;background:var(--ac);color:var(--bg);font-size:13px;font-weight:700;line-height:24px;text-align:center;box-shadow:0 0 0 3px var(--bg)}
.gal{border:1px solid var(--bd);border-radius:6px;overflow:auto;max-height:520px;background:var(--bg2)}
.gal img{display:block;width:100%;max-width:100%}
.gcap{font-size:13.5px;color:var(--tx2)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.pair>div{min-width:0}
@media (max-width:640px){.pair{grid-template-columns:minmax(0,1fr)}}
.code{background:var(--code-bg);border-radius:6px;padding:10px 12px;font-family:var(--m);font-size:12px;line-height:1.6;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.clabel{font-size:12px;color:var(--tx3);font-weight:600;margin-bottom:4px}
@media (max-width:560px){.frame,.layer{height:420px}}

/* table */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
td{padding:7px 10px;border-bottom:1px solid var(--bd);vertical-align:top}
td:first-child{width:58%}
td code{white-space:normal;overflow-wrap:anywhere}
.cp{appearance:none;border:none;background:none;color:var(--tx3);cursor:pointer;font-size:12px;margin-left:4px}
.cp:hover{color:var(--ac)}
.pre{white-space:pre-wrap;font-family:var(--m);font-size:12px;background:var(--code-bg);border-radius:6px;padding:10px 12px}

/* tree */
.tree{font-size:14px}
.tree ul{list-style:none;margin:0 0 0 6px;padding-left:14px;border-left:1px solid var(--bd)}
.tree>ul{border:none;padding:0;margin:0}
.tr{display:flex;gap:8px;align-items:baseline;padding:2px 6px;border-radius:4px;min-width:0;cursor:pointer}
.tr:hover{background:var(--bg2)}
.tr .chev{width:10px;flex:none;color:var(--tx3);font-size:10px;transition:transform .15s}
.tr.open .chev{transform:rotate(90deg)}
.tr .nm{font-family:var(--m);font-size:13px;color:var(--tx);overflow-wrap:anywhere;min-width:0}
.tr.dir .nm{font-weight:500}
.tr.leaf .nm{color:var(--ac)}

/* popover */
.pop{position:fixed;z-index:50;width:min(340px,calc(100vw - 32px));background:var(--bg);border:1px solid var(--bd2);border-radius:8px;box-shadow:var(--sh);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.pop.wide{width:min(460px,calc(100vw - 32px))}
.pop h4{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pop h4 small{font-weight:400;color:var(--tx3);font-size:12px}
.pop .x{appearance:none;border:none;background:none;color:var(--tx3);cursor:pointer;font-size:16px;line-height:1;padding:0}
.pop ul{margin:0;padding-left:18px}
.pop .fl{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--m);font-size:12px}
.pop .back{appearance:none;border:none;background:none;padding:0;color:var(--tx3);font-size:12px;cursor:pointer;align-self:flex-start}
.pop .muted{color:var(--tx2);font-size:13.5px}
.rk{display:grid;grid-template-columns:fit-content(40%) minmax(0,1fr);gap:4px 10px;margin:0;font-size:13.5px}
.rk dt{color:var(--tx2)}
.rk dd{margin:0}
.hl{max-height:min(55vh,420px);overflow:auto;padding-right:4px}
.hl h5{margin:10px 0 2px;font-size:12px;color:var(--tx3);font-weight:600}
.hl div{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.4;padding:2px 0}
.hl b{font-family:var(--m);font-size:11.5px;font-weight:500}
.hl.long div{display:block;padding:3px 0}
.hl.long b{display:block}
@media (max-width:600px){.pop{left:max(16px,env(safe-area-inset-left,0px))!important;right:max(16px,env(safe-area-inset-right,0px));top:auto!important;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto!important}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:6px 12px;border-radius:6px;font-size:13.5px;z-index:60}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  }
  tabs.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;tabs.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b);});show(+b.dataset.i);});
  show(0);
}

/* ---------- repo map ---------- */
if(document.getElementById("tree")){
  var TM={};
  var tr=function(n,id){TM[id]=n;var dir=!!(n.children&&n.children.length);
    var o='<li><div class="tr '+(dir?'dir':'leaf')+(dir&&n.open!==false?' open':'')+'" data-id="'+id+'" role="button" tabindex="0"><span class="chev">'+(dir?'›':'')+'</span><span class="nm">'+esc(n.name)+(dir&&!/\/$/.test(n.name)?'/':'')+'</span></div>';
    if(dir)o+='<ul'+(n.open===false?' hidden':'')+'>'+n.children.map(function(c,i){return tr(c,id+'.'+i);}).join("")+'</ul>';
    return o+'</li>';};
  var treeEl=document.getElementById("tree");treeEl.innerHTML='<ul>'+tr(B.map,'r')+'</ul>';
  var act=function(r){var n=TM[r.dataset.id];
    if(n.children&&n.children.length){var ul=r.nextElementSibling,op=!r.classList.contains("open");r.classList.toggle("open",op);ul.hidden=!op;return;}
    stack=[];openPop('<h4 id="pop-t"><code>'+esc(n.name)+'</code>'+X+'</h4>'+(n.overview?'<ul class="small">'+n.overview.map(function(x){return '<li>'+md(x)+'</li>';}).join("")+'</ul>':'')+(n.path?'<a class="small" href="'+gl(n.path)+'">Open on GitHub</a>':''),r.querySelector(".nm"));};
  treeEl.addEventListener("click",function(e){var r=e.target.closest(".tr");if(r){e.stopPropagation();act(r);}});
  treeEl.addEventListener("keydown",function(e){var r=e.target.closest(".tr");if(r&&(e.key==="Enter"||e.key===" ")){e.preventDefault();act(r);}});
}

/* ---------- swimlane ---------- */
if(document.getElementById("sl")){
  var H=B.how,steps=H.steps,PH=H.phases,LN=H.lanes;
  var chip=function(s,i,mob){return '<button type="button" class="st'+(s.script?' script':'')+'" data-i="'+i+'"><i>'+(i+1)+'</i>'+esc(s.title)+(s.loop?'<span class="lp">↺</span>':'')+(mob?'<em>'+esc(LN[s.lane])+'</em>':'')+'</button>';};
  var sl=document.getElementById("sl");sl.style.gridTemplateColumns="96px repeat("+PH.length+",minmax(150px,1fr))";
  var x='<div></div>'+PH.map(function(p){return '<div class="ph"><b>'+esc(p.title)+'</b><span>'+md(p.overview)+'</span></div>';}).join("");
  LN.forEach(function(ln,l){x+='<div class="ln">'+esc(ln)+'</div>';PH.forEach(function(p,pi){x+='<div class="cell">'+steps.map(function(s,i){return (s.phase===pi&&s.lane===l)?chip(s,i):'';}).join("")+'</div>';});});
  sl.innerHTML=x;
  document.getElementById("slm").innerHTML=PH.map(function(p,pi){return '<div class="ph"><b>'+esc(p.title)+'</b><span>'+md(p.overview)+'</span><div class="steps">'+steps.map(function(s,i){return s.phase===pi?chip(s,i,1):'';}).join("")+'</div></div>';}).join("");
  var slx=document.getElementById("slx"),slw=document.getElementById("slw");
  var edge=function(){slw.classList.toggle("more",slx.scrollLeft+slx.clientWidth<slx.scrollWidth-2);};
  slx.addEventListener("scroll",edge,{passive:true});addEventListener("resize",edge);edge();
  document.getElementById("lanes").addEventListener("click",function(e){var n=e.target.closest(".st");if(!n)return;e.stopPropagation();
    var i=+n.dataset.i,s=steps[i];clearSel();document.querySelectorAll('.st[data-i="'+i+'"]').forEach(function(m){m.classList.add("on");});stack=[];
    openPop('<h4 id="pop-t">'+(s.script?'<code>'+esc(s.title)+'</code>':esc(s.title))+'<small>'+esc(LN[s.lane])+'</small></h4><p>'+md(s.detail)+'</p>'+
      ((s["in"]||s.out)?'<ul class="small">'+(s["in"]?'<li>In: '+md(s["in"])+'</li>':'')+(s.out?'<li>Out: '+md(s.out)+'</li>':'')+'</ul>':'')+
      (s.files&&s.files.length?'<div class="fl">'+s.files.map(function(f){return '<a href="'+gl(f)+'">'+esc(short(f))+'</a>';}).join("")+'</div>':''),n);});
}

/* ---------- use ---------- */
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true;},1600);}
function copy(txt,el){try{navigator.clipboard.writeText(txt).then(function(){toast("Copied");},fb);}catch(e){fb();}
  function fb(){if(!el)return;el.hidden=false;var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected. Press Cmd+C");}}
if(document.getElementById("runpre"))document.getElementById("runpre").textContent=B.use.agentPrompt;
document.addEventListener("click",function(e){
  var c=e.target.closest(".cp");if(c)copy(c.dataset.c,c.previousElementSibling);
  if(e.target.id==="runcp")copy(B.use.agentPrompt,document.getElementById("runpre"));
  if(e.target.id==="runsee"){var p=document.getElementById("runpre");p.hidden=!p.hidden;e.target.textContent=p.hidden?"Preview":"Hide";}
  var eb=e.target.closest("#envseg button");
  if(eb){eb.parentNode.querySelectorAll("button").forEach(function(x){var on=x===eb;x.classList.toggle("on",on);x.setAttribute("aria-selected",on?"true":"false");});
    document.querySelectorAll("#refbody tr").forEach(function(r){r.hidden=r.dataset.e!==eb.dataset.e;});}
});

/* ---------- outline ---------- */
var OL=[].slice.call(document.querySelectorAll(".outline a"));
if(window.IntersectionObserver){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting)OL.forEach(function(a){a.classList.toggle("on",a.dataset.s===en.target.id);});});},{rootMargin:"0px 0px -70% 0px"});
  S.forEach(function(s){io.observe(document.getElementById(s[0]));});}
})();
</script>
</body>
</html>
